# fsbroker mapping example.
#
# Copy this to ~/.config/fsbroker/vroot.toml (or point --config at it) and edit.
# Every [[mount]] without virtual_path appears inside the sandbox at the same
# absolute path it has on the host (identity mapping). Anything not listed is
# ENOENT. Read-only is the default; writable = true is the explicit opt-in.
#
# Two placeholders are expanded before the daemon reads this file:
#   ${run}   the run directory (--run-dir / FSBROKER_RUN_DIR)
#   ${home}  the sandbox's writable home (default ${run}/home)
#
# Uncomment to let a different uid use the mount. This is what
# `fsbroker root-shell` needs: root entering the sandbox's namespaces is refused
# by FUSE unless the mount allows other users. It also requires uncommenting
# `user_allow_other` in /etc/fuse.conf, and it makes <run>/mount reachable by
# any local uid, so the run directory is tightened to 0700 when it is enabled.
#
# allow_other = true

# The sandbox's own writable home, at the fixed path /home/agent. Keep this: it
# is the only place the agent can write without asking.
[[mount]]
virtual_path = "/home/agent"
host = "${home}"
writable = true

# Read-only runtime the GUI and the dynamic linker need.
[[mount]]
host = "/usr"
[[mount]]
host = "/bin"
[[mount]]
host = "/sbin"
[[mount]]
host = "/lib"
[[mount]]
host = "/lib64"
[[mount]]
host = "/opt/OpenCode"

# The real /etc, read-only. The sandbox runs as your uid, so this shows exactly
# what you can already read: /etc/shadow, /etc/sudoers, /etc/ssl/private and the
# like are root-only and stay unreadable. What it buys is the real thing instead
# of a curated copy, which matters because copies go stale — a missing
# /etc/alternatives breaks every symlink chain through it (libblas, lapack,
# anything update-alternatives manages).
#
# A few files are still overridden, by binds in `bin/fsbroker`: passwd and group
# (so the sandbox user's home is /home/agent), hostname, hosts and machine-id.
[[mount]]
host = "/etc"

# Real user data, read-only by default. Writes escalate to the broker.
# [[mount]]
# host = "/home/rj/Documents"
# [[mount]]
# host = "/home/rj/src"

# Empty placeholders so bubblewrap can mount its own /proc, /dev, /tmp and /run
# on top of them.
[[mount]]
virtual_path = "/proc"
host = "${run}/placeholders/proc"
[[mount]]
virtual_path = "/dev"
host = "${run}/placeholders/dev"
[[mount]]
virtual_path = "/tmp"
host = "${run}/placeholders/tmp"
[[mount]]
virtual_path = "/run"
host = "${run}/placeholders/run"

# --- pass-throughs ---------------------------------------------------------
# Host objects bound into the sandbox as-is, after the virtual root. These are
# for things the vroot cannot serve: it can show a unix socket's name, but
# connect() through it fails, because the kernel needs a real socket inode, and
# device nodes are the same. They also live under /run and /dev, which are built
# by bubblewrap rather than mapped.
#
# The ones a desktop normally needs are built in (the PipeWire/Pulse socket,
# /dev/snd for ALSA, and systemd-resolved's resolv.conf, which /etc/resolv.conf
# points into). Add more here; `dev = true` binds a device node.
#
# [[pass]]
# host = "/run/user/1000/pipewire-0"
# [[pass]]
# host = "/dev/snd"
# dev = true
# [[pass]]
# host = "/run/user/1000/bus"        # the session D-Bus: a big capability
